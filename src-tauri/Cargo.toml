[package]
name = "mnemosyne"
version = "0.2.0"
description = "Mnemosyne — A Private Photo Atelier"
authors = ["Somniel Holdings LLC"]
edition = "2021"

[lib]
name = "mnemosyne_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
photo_sources = { path = "../crates/photo_sources" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
