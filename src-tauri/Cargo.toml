[package]
name = "mnemosyne"
version = "0.2.0"
description = "Mnemosyne — A Private Photo Atelier"
authors = ["Somniel Holdings LLC"]
edition = "2021"
rust-version = "1.85"
default-run = "mnemosyne"

[lib]
name = "mnemosyne_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mnemosyne"
path = "src/main.rs"

[[bin]]
name = "mnemosyne-index"
path = "src/bin/mnemosyne-index.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
jwalk = "0.8"
rayon = "1"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
kamadak-exif = "0.6"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
