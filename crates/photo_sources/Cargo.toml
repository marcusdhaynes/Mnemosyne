[package]
name = "photo_sources"
version = "0.1.0"
edition = "2021"
description = "Mnemosyne source adapters, export unpacking, and journaled commit/undo"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
blake3 = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "photo_sources"
path = "src/bin/photo_sources.rs"
